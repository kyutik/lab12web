<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Реєстрація користувача</title>
  <link rel="stylesheet" href="../css/lab12.css">
</head>
<body>
  <header class="blog-header">
    <div><a class="blog-name" href="PieshkoLab11-1.htm">Мій особистий блог</a><br>Владислав Пєшко</div>
    <nav aria-label="Сторінки лабораторної">
      <a href="git_commands.html">Команди Git</a>
      <a href="register.html">Реєстрація</a>
    </nav>
  </header>
  <main class="register-page">
    <section class="register-panel">
      <h1>Реєстрація користувача</h1>
      <form>
        <label>Прізвище
          <input type="text" name="surname" autocomplete="family-name">
        </label>
        <label>Ім’я
          <input type="text" name="given_name" autocomplete="given-name">
        </label>
        <label>Логін
          <input type="text" name="username" autocomplete="username">
        </label>
        <label>Навчальна група
          <select name="group"><option value="">Оберіть групу</option><option value="305-TN">305-ТН</option></select>
        </label>
        <label>Пароль
          <input type="password" name="password" autocomplete="new-password">
        </label>
        <label>Підтвердження пароля
          <input type="password" name="confirm_password" autocomplete="new-password">
        </label>
        <p class="form-note">Навчальна форма. Дані не надсилаються.</p>
        <button type="button">Зареєструватись</button>
      </form>
    </section>
  </main>
  <footer class="blog-footer">Розробник — Владислав Пєшко</footer>
</body>
</html>
